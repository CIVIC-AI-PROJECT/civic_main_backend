[pytest]
# Pytest configuration for Kiro Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for different test types
markers =
    unit: Unit tests for individual components
    property: Property-based tests using Hypothesis
    contract: Contract tests for schema validation
    integration: Integration tests with AWS services
    slow: Tests that take longer to run

# Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
